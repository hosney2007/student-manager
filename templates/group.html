{% extends "base.html"%}

{%block body%}

<section class="recorded-page">
    <div class="recorded-header">
       <h1>Groups</h1>
       <p class="subtitle">{{group|length}} group(s)</p>
    </div>
</section>

<div class="actions-row">
    <a class="btn btn-primary" href="{{url_for('groups.add_group')}}">+ add group</a>
</div>

<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>Group Name</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {%for group in group%}
            <tr>
                <td class="primary-cell">{{group.name}}</td>
                <td class="actions">
                    <a class="btn btn-sm" href="{{url_for('groups.group_students', group_id=group.id)}}">view students</a>
                    <a class="btn btn-sm" href="{{url_for('groups.edit_group', group_id=group.id)}}">Edit</a>
                </td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
    {%if not group%}
    <div class="empty-state">no groups yet — add your first one above</div>
    {%endif%}
</div>

{%endblock%}
