{% extends "base.html"%}
{%block body%}

<section class="recorded-page">
    <div class="recorded-header">
       <h1>Attendance — {{group.name}}</h1>
       <p class="subtitle">check the students who are present today</p>
    </div>
</section>

<div class="admin-container">
    <div class="card-admin">
        <form method="post">
            {% for link in links %}
            <label class="checkbox-row">
                <input type="checkbox" name="present" value="{{link.student_id}}">
                {{link.student.name}}
            </label>
            {% else %}
            <div class="empty-state">no students in this group</div>
            {% endfor %}

            {% if links %}
            <div class="submit-btn">
                <button type="submit">save attendance</button>
            </div>
            {% endif %}
        </form>
    </div>
</div>

{%endblock%}
