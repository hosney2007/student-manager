<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Student Manager</div>
            <nav class="sidebar-nav">
                <a href="{{url_for('home')}}">Home</a>
                <a href="{{url_for('students.student')}}">Students</a>
                <a href="{{url_for('groups.group')}}">Groups</a>
            </nav>
        </aside>

        <div class="main">
            <header class="topbar">
                <h2>{{name}}</h2>
            </header>

            <main class="content">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="flash flash-{{category}}">{{message}}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                {%block body%}
                {%endblock%}
            </main>
        </div>
    </div>
</body>
</html>
